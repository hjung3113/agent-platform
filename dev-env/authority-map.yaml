version: 2
authoritative_domains:
  product_intent:
    source_paths:
      - docs/product/
    authority_requires:
      - human_approval
      - kernel_admission
      - immutable_published_revision
  product_behavior:
    source_paths:
      - docs/specs/
    authority_requires:
      - human_approval_when_material
      - kernel_admission
      - immutable_published_revision
  architecture_decisions:
    source_paths:
      - docs/adr/
    authority_requires:
      - human_approval_when_material
      - kernel_admission
      - immutable_published_revision
  machine_contracts:
    source_paths:
      - ../product/contracts/
    authority_requires:
      - kernel_admission
      - immutable_published_revision
reference_only:
  vocabulary:
    - ../product/CONTEXT.md
non_authoritative:
  research:
    - docs/research/
  reviews:
    - docs/reviews/
  plans:
    - docs/plans/
  derived_memory:
    - ../product/memory/derived/
invariants:
  - path_presence_does_not_confer_authority
  - schema_validity_does_not_confer_authority
  - llm_verdict_is_never_an_admission_predicate
  - derived_content_cannot_introduce_new_authoritative_facts
